  <section class="container">
    <h2>📬 Contact Me</h2>
    <p>Have questions, suggestions, or feedback? Use the form below or reach out via email.</p>

    <form action="https://formsubmit.co/your-email@example.com" method="POST" class="contact-form">
  <!-- Formsubmit settings (optional but useful) -->
  <input type="hidden" name="_next" value="https://fta.edu.pk/thank-you.html" />
  <input type="hidden" name="_captcha" value="false" />

  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required />

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required />

  <label for="message">Message:</label>
  <textarea id="message" name="message" rows="5" required></textarea>

  <button type="submit">Send Message</button>
</form>

    <p style="margin-top: 20px;">📧 Or email me directly at: <a href="mailto:your-email@example.com">asadalicz1@gmail.com</a></p>
